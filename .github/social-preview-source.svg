<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">A11y Toast social preview</title>
  <desc id="description">Accessible toast feedback with predictable focus, timing, and announcements.</desc>
  <defs>
    <linearGradient id="copy-panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f7f8f9"/>
      <stop offset="0.78" stop-color="#f7f8f9" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#f7f8f9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#f7f8f9"/>
  <image href="social-preview-art.png" x="0" y="0" width="1280" height="640" preserveAspectRatio="xMidYMid slice"/>
  <rect width="790" height="640" fill="url(#copy-panel)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#1f2b34">
    <text x="80" y="152" font-size="22" font-weight="700" letter-spacing="3" fill="#566771">TYPESCRIPT · ZERO RUNTIME DEPENDENCIES</text>
    <text x="80" y="276" font-size="82" font-weight="700" letter-spacing="-4">A11y Toast</text>
    <text x="80" y="360" font-size="31" font-weight="500">
      <tspan x="80" dy="0">Accessible toast feedback with predictable</tspan>
      <tspan x="80" dy="46">focus, timing, and announcements.</tspan>
    </text>
    <rect x="80" y="474" width="206" height="54" rx="27" fill="#244956"/>
    <text x="183" y="509" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Framework-free</text>
  </g>
</svg>
